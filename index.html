          "🎉🎉🎉", "ভাই দারুণ কাজ করছেন", "ওয়াও 😮", "সবাইকে স্বাগতম 🙏"
        ]
      }
    };

    // ==========================================
    // চ্যাট লিস্ট রেন্ডার
    // ==========================================
    function initChatList() {
      const container = document.getElementById('chat-list-container');
      container.innerHTML = '';
      CONFIG.channels.forEach((channel, idx) => {
        const item = document.createElement('div');
        item.className = 'chat-item';
        item.setAttribute('data-idx', idx);
        item.setAttribute('data-online', 'true');
        item.addEventListener('click', () => window.open(channel.redirectUrl, '_blank'));
        const verifiedIconHTML = channel.name.includes('✅') ? `<svg class="verified-icon" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>` : '';
        const checkmarkHTML = !channel.isMuted ? `<svg class="double-tick" viewBox="0 0 24 24"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM2 13.5l1.41-1.41 4.24 4.24-1.41 1.41L2 13.5z" fill="#229ed9"/></svg>` : '';
        const avatarInner = channel.logoUrl ? `<img src="${channel.logoUrl}" alt="${channel.avatarText}">` : channel.avatarText;
        item.innerHTML = `
          <div class="avatar ${channel.avatarClass}">${avatarInner}</div>
          <div class="chat-details">
            <div class="chat-row-top">
              <div class="chat-name-area"><span class="chat-title">${channel.name.replace(' ✅', '')}</span>${verifiedIconHTML}</div>
              <div class="chat-time-status">${checkmarkHTML}<span>${channel.timeText}</span></div>
            </div>
            <div class="chat-row-bottom">
              <span class="chat-message-preview" id="preview-${idx}">অনলাইন</span>
              <span class="unread-badge ${channel.isMuted ? 'muted' : ''}" id="badge-${idx}">${channel.initialUnreads}</span>
            </div>
          </div>`;
        container.appendChild(item);
      });
      const fallback = CONFIG.channels[0].redirectUrl;
      document.getElementById('fab-action').addEventListener('click', () => window.open(fallback, '_blank'));
      ['nav-chats','nav-contacts','nav-settings','nav-profile'].forEach(id => {
        document.getElementById(id).addEventListener('click', (e) => { e.preventDefault(); window.open(fallback, '_blank'); });
      });
    }

    function startRealTimeSimulator() {
      const states = CONFIG.channels.map((ch) => ({ unreads: ch.initialUnreads, step: 0, progress: 10 }));
      setInterval(() => {
        CONFIG.channels.forEach((channel, idx) => {
          const state = states[idx];
          const previewEl = document.getElementById(`preview-${idx}`);
          const badgeEl = document.getElementById(`badge-${idx}`);
          if (!previewEl || !badgeEl) return;
          state.step = (state.step + 1) % 5;
          if (state.step === 0) { previewEl.innerText = "অনলাইন"; previewEl.classList.remove('active-live'); }
          else if (state.step === 1) { previewEl.innerHTML = `✍️ টাইপ করছেন <span class="typing-dots"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></span>`; previewEl.classList.add('active-live'); }
          else if (state.step === 2) { previewEl.innerText = `📹 ভিডিও আপলোড হচ্ছে (12%)...`; previewEl.classList.add('active-live'); }
          else if (state.step === 3) { previewEl.innerText = `📹 ভিডিও আপলোড হচ্ছে (74%)...`; previewEl.classList.add('active-live'); }
          else if (state.step === 4) {
            previewEl.innerText = "📹 ৩টি নতুন ভিডিও ফাইল আপলোড করা হয়েছে! ✓✓"; previewEl.classList.remove('active-live');
            state.unreads += 1; badgeEl.innerText = state.unreads;
            badgeEl.style.animation = 'none';
            setTimeout(() => { badgeEl.style.animation = 'badgePulse 0.3s ease'; }, 10);
            updateGlobalBadges();
          }
        });
      }, 3000);
    }
    function updateGlobalBadges() {
      let total = 0;
      document.querySelectorAll('.chat-list .unread-badge').forEach(b => { total += parseInt(b.innerText) || 0; });
      document.getElementById('all-tab-badge').innerText = total;
      document.getElementById('nav-unread-badge').innerText = total;
    }

    // ==========================================
    // লাইভ গ্রুপ চ্যাট
    // ==========================================
    const liveScreen = document.getElementById('live-screen');
    const liveMessages = document.getElementById('live-messages');
    const liveInput = document.getElementById('live-input');
    let autoChatTimer = null, memberTimer = null, curMembers = 0, curOnline = 0;

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }
    function nowTime() {
      const d = new Date(); let h = d.getHours(), m = d.getMinutes();
      const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
      return `${h}:${m < 10 ? '0'+m : m} ${ap}`;
    }
    function buildLinkPreview(p) {
      if (!p || (!p.image && !p.title)) return '';
      const safeUrl = (p.url || '#').replace(/'/g, "%27");
      const domain = p.url ? p.url.replace(/^https?:\/\//, '').split('/')[0] : '';
      const imgHtml = p.image ? `<img src="${p.image}" alt="preview" onerror="this.style.display='none'">` : '';
      return `<div class="link-preview" onclick="window.open('${safeUrl}','_blank')">${imgHtml}<div class="link-preview-body"><div class="link-preview-title">${escapeHtml(p.title || '')}</div><div class="link-preview-desc">${escapeHtml(p.description || '')}</div><div class="link-preview-domain">${escapeHtml(domain)}</div></div></div>`;
    }
    // মেসেজে লেখা + লিংক + ছবি একসাথে সাজানো
    function formatMessageBody(rawText) {
      let html = '';
      const parts = String(rawText).split(/(https?:\/\/[^\s<]+)/g);
      parts.forEach(part => {
        if (/^https?:\/\//.test(part)) {
          if (/\.(jpe?g|png|gif|webp|bmp)(\?.*)?$/i.test(part)) {
            html += `<img class="msg-image" src="${part}" alt="image" onclick="window.open('${part.replace(/'/g,'%27')}','_blank')" onerror="this.style.display='none'">`;
          } else {
            html += `<a href="${part}" target="_blank" rel="noopener">${escapeHtml(part)}</a>`;
            const sp = CONFIG.liveGroup.defaultSitePreview;
            if (sp && (sp.image || sp.title)) html += buildLinkPreview({ image: sp.image, title: sp.title, description: sp.description, url: part });
          }
        } else if (part) {
          html += escapeHtml(part).replace(/\n/g, '<br>');
        }
      });
      return html;
    }

    function addMessage({ sender, text, color, me = false, isHtml = false, logoUrl = "" }) {
      const row = document.createElement('div');
      row.className = 'msg-row' + (me ? ' me' : '');
      const initials = me ? 'আ' : (sender ? sender.charAt(0).toUpperCase() : '?');
      const avatarColor = me ? '#2b5278' : (color || '#555');
      const avatarInner = (!me && logoUrl) ? `<img src="${logoUrl}" alt="${escapeHtml(sender || '')}">` : initials;
      const senderHTML = me ? '' : `<div class="msg-sender" style="color:${color || '#6ec1ff'}">${escapeHtml(sender)}</div>`;
      const bodyHTML = isHtml ? text : escapeHtml(text);
      row.innerHTML = `<div class="msg-avatar" style="background:${avatarColor}">${avatarInner}</div><div class="msg-bubble">${senderHTML}<div class="msg-text">${bodyHTML}</div><div class="msg-time">${nowTime()}</div></div>`;
      liveMessages.appendChild(row);
      liveMessages.scrollTop = liveMessages.scrollHeight;
    }

    function pushRandomFakeMessage() {
      const g = CONFIG.liveGroup;
      const user = g.fakeUsers[Math.floor(Math.random() * g.fakeUsers.length)];
      const text = g.fakeMessages[Math.floor(Math.random() * g.fakeMessages.length)];
      addMessage({ sender: user.name, text: formatMessageBody(text), color: user.color, logoUrl: user.logoUrl, isHtml: true });
    }

    function updateMemberText() {
      document.getElementById('live-header-sub').innerText = `${curMembers.toLocaleString('en-US')} members, ${curOnline.toLocaleString('en-US')} online`;
    }

    function openLiveChat() {
      const g = CONFIG.liveGroup;
      document.getElementById('live-header-name').innerText = g.name;
      const hAv = document.getElementById('live-header-avatar');
      hAv.innerHTML = g.logoUrl ? `<img src="${g.logoUrl}" alt="${g.avatarText}">` : g.avatarText;
      document.getElementById('pinned-label').innerText = g.pinnedLabel || '📌 Pinned';
      document.getElementById('pinned-text').innerText = g.pinnedText || '';
      const pinJoin = document.getElementById('pinned-join');
      pinJoin.innerText = g.joinButtonText || 'Join';
      pinJoin.onclick = () => window.open(g.joinButtonLink, '_blank');

      liveMessages.innerHTML = '';
      for (let i = 0; i < 8; i++) pushRandomFakeMessage();
      liveScreen.classList.add('open');

      if (autoChatTimer) clearInterval(autoChatTimer);
      autoChatTimer = setInterval(() => pushRandomFakeMessage(), 1800 + Math.random() * 1800);

      curMembers = g.startMembers; curOnline = g.startOnline;
      updateMemberText();
      if (memberTimer) clearInterval(memberTimer);
      memberTimer = setInterval(() => {
        curMembers += Math.floor(Math.random() * 4) + 1;
        curOnline += Math.floor(Math.random() * 7) - 2;
        if (curOnline < 50) curOnline = 50;
        updateMemberText();
      }, 2000);
    }

    function closeLiveChat() {
      liveScreen.classList.remove('open');
      if (autoChatTimer) { clearInterval(autoChatTimer); autoChatTimer = null; }
      if (memberTimer) { clearInterval(memberTimer); memberTimer = null; }
    }

    function sendUserMessage() {
      const val = liveInput.value.trim();
      if (!val) return;
      addMessage({ text: val, me: true });
      liveInput.value = '';
      setTimeout(() => {
        addMessage({ sender: 'Admin', text: formatMessageBody(CONFIG.liveGroup.autoReplyMessage), color: '#229ed9', isHtml: true });
      }, 800);
    }

    document.getElementById('live-chat-tab').addEventListener('click', openLiveChat);
    document.getElementById('live-back').addEventListener('click', closeLiveChat);
    document.getElementById('live-send').addEventListener('click', sendUserMessage);
    liveInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendUserMessage(); });

    window.addEventListener('DOMContentLoaded', () => {
      initChatList();
      updateGlobalBadges();
      startRealTimeSimulator();
    });
  </script>
